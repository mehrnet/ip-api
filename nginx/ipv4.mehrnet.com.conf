# DNS-only IPv4 responder. Publish one A record and no AAAA record.

server {
    listen 80 backlog=4096;
    server_name ipv4.mehrnet.com;

    access_log off;
    error_log /var/log/nginx/ipv4.mehrnet.com.error.log warn;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/mehrnet-ip-api/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    include /etc/nginx/snippets/mehrnet-ip-response.conf;
}

server {
    listen 443 ssl http2 backlog=4096;
    server_name ipv4.mehrnet.com;

    ssl_certificate /etc/letsencrypt/live/ipv4.mehrnet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ipv4.mehrnet.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:mehrnet_ip_api_ipv4:1m;
    ssl_session_timeout 1h;

    access_log off;
    error_log /var/log/nginx/ipv4.mehrnet.com.error.log warn;
    client_max_body_size 1k;
    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 5s;
    keepalive_timeout 15s;
    keepalive_requests 1000;
    reset_timedout_connection on;
    server_tokens off;

    include /etc/nginx/snippets/mehrnet-ip-response.conf;
}
