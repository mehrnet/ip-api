# DNS-only IPv6 responder. Publish one AAAA record and no A record.

server {
    listen [::]:80 ipv6only=on backlog=4096;
    server_name ipv6.mehrnet.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/mehrnet-ip-api/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen [::]:443 ssl http2 ipv6only=on backlog=4096;
    server_name ipv6.mehrnet.com;

    ssl_certificate /etc/letsencrypt/live/ipv6.mehrnet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ipv6.mehrnet.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:mehrnet_ip_api_ipv6:1m;
    ssl_session_timeout 1h;

    access_log off;
    error_log /var/log/nginx/ipv6.mehrnet.com.error.log warn;
    client_max_body_size 1k;
    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 5s;
    keepalive_timeout 15s;
    keepalive_requests 1000;
    reset_timedout_connection on;
    server_tokens off;

    include /etc/nginx/snippets/mehrnet-ip-response.conf;
}
