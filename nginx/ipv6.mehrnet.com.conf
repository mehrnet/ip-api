# Serve this vhost only on the IPv6 responder host/network path.
# DNS must publish an AAAA record and no A record for ipv6.mehrnet.com.

server {
    listen [::]:80 ipv6only=on;
    server_name ipv6.mehrnet.com;

    # Optional when this host is behind Cloudflare. The generated include only
    # trusts published Cloudflare proxy ranges before honoring CF-Connecting-IP.
    # include /etc/nginx/snippets/cloudflare-realip.conf;

    include /etc/nginx/snippets/mehrnet-ip-response.conf;
}
