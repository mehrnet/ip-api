# Install in /etc/nginx/conf.d/. This file is included from Nginx's http
# context, while the matching limit directives live in ip-response.conf.
server_names_hash_bucket_size 64;

limit_req_zone $binary_remote_addr zone=mehrnet_ip_api_rate:1m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=mehrnet_ip_api_connections:1m;
