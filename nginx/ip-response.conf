# Included inside a responder server block for a DNS-only responder.
# `$remote_addr` is the TCP peer selected by the address-family-specific DNS
# record and listener. Do not add proxy or forwarded-header processing here.

location = / {
    limit_req zone=mehrnet_ip_api_rate burst=60 nodelay;
    limit_conn mehrnet_ip_api_connections 16;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    default_type text/plain;
    charset utf-8;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;

    return 200 "$remote_addr";
}

location / {
    return 404;
}
